<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>約飯 · Tablemate</title>
  <meta name="description" content="約飯：發起你想吃的那一餐，挑選同行飯友，準時赴約。">
  <style>
    :root { --accent: #e3553a; --ink: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f5f5f7; --muted: #a1a1a6; --bg: #000; --card: #1c1c1e; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
           font: 17px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
    main { width: 100%; max-width: 480px; background: var(--card); border-radius: 28px; padding: 36px 28px; text-align: center; }
    .mark { width: 88px; height: 88px; margin: 0 auto 18px; border-radius: 26px; background: var(--accent); color: #fff;
            display: grid; place-items: center; font-size: 48px; font-weight: 800; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 24px; }
    nav { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-size: 15px; }
    a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">約</div>
    <h1>約飯</h1>

</html>
