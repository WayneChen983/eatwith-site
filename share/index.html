<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>飯約 · 有人約吃飯</title>
  <meta property="og:title" content="飯約：有人約吃飯，一起來嗎？">
  <meta property="og:description" content="打開飯約 App 查看這場飯局，申請加入。">
  <style>
    :root { --accent: #d2385f; --ink: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f5f5f7; --muted: #a1a1a6; --bg: #000; --card: #1c1c1e; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; background: var(--bg); color: var(--ink); }
    main { width: 100%; max-width: 420px; background: var(--card); border-radius: 28px; padding: 32px 24px; text-align: center;
           box-shadow: 0 10px 40px rgba(0,0,0,.08); }
    .mark { width: 88px; height: 88px; margin: 0 auto 16px; border-radius: 26px; display: block; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.button { display: block; padding: 15px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; }
    a.secondary { display: block; margin-top: 12px; color: var(--accent); text-decoration: none; font-size: 15px; }
    [hidden] { display: none !important; }
    small { display: block; margin-top: 24px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="../icon.png" alt="" aria-hidden="true">
    <h1>有人約吃飯，一起來嗎？</h1>
    <p>在飯約 App 裡查看這場飯局的時間、地點和主揪，申請加入。</p>
    <a class="button" id="open" href="#">打開飯約</a>
    <a class="secondary" id="store" href="#">還沒有 App？前往 App Store</a>
    <a class="secondary" id="play" href="#">Android？前往 Google Play</a>
    <small>飯約：找人一起去吃。在公共場所見面，付款方式照飯局說明。</small>
  </main>
  <script>
    // ?dinner=<uuid> → eatwith://dinner/<uuid> (iPhone), or an intent: link on Android that opens the app
    // or, when it isn't installed, Google Play. Set APP_STORE_URL once the app is listed.
    const APP_STORE_URL = 'https://apps.apple.com/';
    const PLAY_URL = 'https://play.google.com/store/apps/details?id=tw.tw466376.eatwith';
    const id = new URLSearchParams(location.search).get('dinner') || '';
    const valid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
    const path = valid ? `dinner/${id.toLowerCase()}` : '';
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const android = /Android/.test(navigator.userAgent);
    const open = document.getElementById('open');
    const store = document.getElementById('store');
    const play = document.getElementById('play');
    store.href = APP_STORE_URL;
    play.href = PLAY_URL;
    if (android) {
      open.href = `intent://${path}#Intent;scheme=eatwith;package=tw.tw466376.eatwith;` +
        `S.browser_fallback_url=${encodeURIComponent(PLAY_URL)};end`;
      store.hidden = true;
      play.textContent = '還沒有 App？前往 Google Play';
    } else {
      open.href = `eatwith://${path}`;
      if (ios) play.hidden = true;
    }
    if (valid && ios) location.href = open.href;
  </script>
</body>
</html>
